name: Deploy Agregator Backend to Cloud Run

on:
  push:
    branches:
      - main
      - dev

env:
  GCP_PROJECT_ID: ad-dev-crm
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY_REPO: agregator-backend-repo
  DB_PASSWORD_SECRET_NAME: agregator-db-password

jobs:
  deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/<YOUR_PROJECT_NUMBER>/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-deployer@ad-dev-crm.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Determine Environment and Service Name
        id: vars
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "GCP_SERVICE_NAME=agregator-backend-prod" >> $GITHUB_OUTPUT
            echo "ENV_TAG=prod" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "GCP_SERVICE_NAME=agregator-backend-dev" >> $GITHUB_OUTPUT
            echo "ENV_TAG=dev" >> $GITHUB_OUTPUT
          else
            echo "Branch ${{ github.ref_name }} is not configured for deployment."
            exit 1
          fi

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/agregator-backend:${{ steps.vars.outputs.ENV_TAG }}-${{ github.sha }}
          docker build --tag $IMAGE_TAG .
          docker push $IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT
        id: docker

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ steps.vars.outputs.GCP_SERVICE_NAME }} \
            --image ${{ steps.docker.outputs.IMAGE_TAG }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --quiet \
            --update-env-vars DB_INSTANCE_CONNECTION_NAME=ad-dev-crm:us-central1:ai-gator-sql,DB_NAME=gator_tools,DB_USER=gator-backend,GCS_BUCKET_NAME=gatorbucket \
            --update-secrets=DB_PASSWORD=${{ env.DB_PASSWORD_SECRET_NAME }}:latest
