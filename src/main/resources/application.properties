spring.application.name=agregator-backend

# ================================================
# SPRING DATASOURCE (Cloud SQL MySQL with Socket Factory)
# ================================================
# Read values from environment variables (or .env file locally)
spring.cloud.gcp.sql.instance-connection-name=${DB_INSTANCE_CONNECTION_NAME}
spring.cloud.gcp.sql.database-name=${DB_NAME}

spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Use the Cloud SQL Socket Factory (URL now references env vars)
spring.datasource.url=jdbc:mysql:///${DB_NAME}?cloudSqlInstance=${DB_INSTANCE_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.mysql.SocketFactory&useSSL=false

# --- Standard JDBC URL (for local testing IF NOT using gcloud auth / Socket Factory) ---
# Needs environment variables too if used
# spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true

# ================================================
# JPA / HIBERNATE
# ================================================
# Specify MySQL dialect (Explicitly set for Cloud SQL Socket Factory compatibility)
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect # Older property
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Hibernate ddl-auto modes:
#   validate: validate the schema, makes no changes to the database.
#   update: update the schema.
#   create: creates the schema, destroying previous data.
#   create-drop: drops the schema when the SessionFactory is closed explicitly, typically when the application stops.
#   none: disables DDL handling.
# Use 'update' or 'validate' for development/production after initial setup.
# Use 'create' or 'create-drop' for initial schema generation or tests.
spring.jpa.hibernate.ddl-auto=update

# Show SQL statements in logs (useful for debugging)
spring.jpa.show-sql=true

# Format SQL statements in logs
spring.jpa.properties.hibernate.format_sql=true

# ================================================
# SERVER PORT (Optional)
# ================================================
# server.port=8080

# ================================================
# Google Cloud Storage Configuration
# ================================================
# Read from environment variable, default to 'gatorbucket' if not set
gcs.bucket.name=${GCS_BUCKET_NAME:gatorbucket}

# ================================================
# Kafka Configuration
# ================================================
# Read Kafka broker list from environment variable (e.g., "kafka-broker-1:9092,kafka-broker-2:9092")
spring.kafka.bootstrap-servers=${KAFKA_BROKERS}

# --- Topic Name and Group ID specifically for the Listener annotation ---
kafka.topic.tool.approved=tool-approved-topic
kafka.consumer.group-id=${spring.kafka.consumer.group-id} # Reference the spring property for consistency

# Confluent Cloud Security Configuration (SASL_SSL)
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username='${KAFKA_API_KEY}' password='${KAFKA_API_SECRET}';

# Consumer specific SASL settings (inherited from common properties but can be explicit)
spring.kafka.consumer.properties.security.protocol=SASL_SSL
spring.kafka.consumer.properties.sasl.mechanism=PLAIN
spring.kafka.consumer.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username='${KAFKA_API_KEY}' password='${KAFKA_API_SECRET}';

# Producer specific SASL settings (inherited from common properties but can be explicit)
spring.kafka.producer.properties.security.protocol=SASL_SSL
spring.kafka.producer.properties.sasl.mechanism=PLAIN
spring.kafka.producer.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username='${KAFKA_API_KEY}' password='${KAFKA_API_SECRET}';

# Configure Producer for JSON
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Type mapping not strictly needed here if producer always sends same type, but good practice
spring.kafka.producer.properties.spring.json.type.mapping=toolCreate:com.agregator.backend.model.ToolCreateRequest

# Configure Consumer for JSON
spring.kafka.consumer.group-id=agregator-backend-group # Consumer group ID
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# Crucial: Tell the JsonDeserializer which local packages to trust for safety
# Removed external package as we now ignore type headers
spring.kafka.consumer.properties.spring.json.trusted.packages=com.agregator.backend.model,java.util,java.lang
# Ignore type headers from producer and use a default type
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.agregator.backend.model.ToolApprovedEvent
# Configure error handling (e.g., log and continue)
# Recommended for better performance
spring.kafka.listener.async-acks=true
# For exactly-once semantics if broker supports
spring.kafka.consumer.properties.isolation.level=read_committed

# Enable transaction support if using Kafka transactions (more advanced)
# spring.kafka.producer.transaction-id-prefix=tx-
